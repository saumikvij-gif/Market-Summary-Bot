# .github/workflows/market_summary.yml
#
# GENERATE step: runs after the US market close (Mon–Fri 23:45 UTC — late
# enough that Bloomberg's same-day "The Close" episode is on YouTube) to
# produce the summary, update the trend database, and regenerate the charts —
# then commits them. It does NOT send email; delivery is a separate workflow
# (email_summary.yml) triggered at 01:00 UTC (9 AM SGT).
#
# Required secret:
#   ANTHROPIC_API_KEY  →  Settings → Secrets and variables → Actions → New secret

name: Generate Market Summary

on:
  # ── Scheduled trigger: Mon–Fri at 23:45 UTC (≈ 7:45 PM ET — after the close
  #    AND after Bloomberg uploads the same-day "The Close" episode ~23:00 UTC).
  #    Kept as a fallback — GitHub's own scheduler often fires hours late, so the
  #    on-time trigger is the external one below.
  schedule:
    - cron: "45 23 * * 1-5"

  # ── On-time external trigger: a cron-job.com ping POSTs to the repo's
  #    /dispatches endpoint with {"event_type":"generate-summary"} at 23:45 UTC.
  #    Fires on the minute, unlike GitHub's best-effort schedule.
  repository_dispatch:
    types: [generate-summary]

  # ── Manual trigger (useful for testing)
  workflow_dispatch:

jobs:
  market-summary:
    name: Generate Market Summary
    runs-on: ubuntu-latest
    timeout-minutes: 45   # FinBERT (torch) install + model + Chromium (three
                          # Bloomberg transcript scrapes) take several minutes

    permissions:
      contents: write   # needed to commit the summary back to the repo

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Cache the FinBERT model so it isn't re-downloaded every run ─────────
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-prosusai-v1

      # ── 4. Install dependencies (incl. FinBERT for the default hybrid engine) ──
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # CPU-only torch keeps the install lean; then the rest of the ML extras.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ml.txt

      # ── 4b. Chromium for the Bloomberg "The Close" transcript scrape ──────────
      #    (the transcript panel needs a real browser; cached between runs)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # ── 5. Run the script ─────────────────────────────────────────────────────
      - name: Run market summary script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENTIMENT_ENGINE: hybrid
          # Optional rotating-residential proxy for the Bloomberg "The Close"
          # transcript pull (YouTube blocks cloud IPs). Unset secrets expand to
          # empty strings, which bloomberg_close.py treats as absent — the
          # section then runs in episode-rundown mode instead. Add the two
          # WEBSHARE_* secrets to switch full-transcript mode on, no code change.
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          # No SMTP_* here on purpose: email is sent later by email_summary.yml,
          # so with no SMTP config the script's email step auto-skips.
        run: |
          mkdir -p summaries
          # One PDF briefing per trading day. The script names the file by the data's
          # SESSION date (not the wall-clock UTC date), so a delayed run that slips to
          # the next UTC day still overwrites the correct day's file instead of minting
          # a phantom dated PDF of stale data.
          export SUMMARY_DIR="summaries"
          python market_summary.py

      # ── 5. Commit & push the generated summary ────────────────────────────────
      - name: Commit summary and history to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit the dated summary, the CSV history (text, mergeable), and charts.
          # The CSVs are the single source of truth; charts are rebuilt from them.
          # history_options.csv is the options-positioning evaluation log — option
          # flow can't be backfilled, so this accumulated record is how the metric
          # gets validated (or dropped).
          git add summaries/ history_quotes.csv history_summaries.csv history_options.csv charts/
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: add market summary $(date -u +'%Y-%m-%d') [skip ci]"
          # Integrate any commits pushed since checkout, then push. Retry to
          # survive a race with a concurrent push (CSVs merge cleanly).
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "Push attempt $attempt failed; retrying after fetch…"
            sleep 5
          done

      # ── 6. Alert on failure ───────────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WORKFLOW_NAME: Generate Market Summary
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_failure.py
